name: CI

on:
  pull_request:
    branches: [testing, main]
  push:
    branches: [testing, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Hong_Kong
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:live-auth
      - run: npm run build
