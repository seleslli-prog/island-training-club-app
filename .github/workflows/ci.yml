name: CI

on:
  pull_request:
    branches: [testing, main]
  push:
    branches: [testing, main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Hong_Kong
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Live-auth tests
        run: npm run test:live-auth
      - name: Verify static app
        run: npm run build
